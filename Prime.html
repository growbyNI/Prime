            {

                price: 1999,

            },
            {

            },

            },
            {

                originalPrice: 2399,

                reviews: 167,
                category: "Electronics",
                image: "img-bluetooth-speaker.PNG",
                description: "Portable Bluetooth speaker with 360-degree sound and waterproof design. Perfect for outdoor activities.",
                features: ["360-degree Sound", "Waterproof", "12-hour Battery", "Portable"]
            },
            {
                id: 12,
                name: "LED Spiral Table Lamp Modern Curved Desk Bedside Lamp Dimmable Warm White Night Light For Living Room And Bedroom",
                price: 3499,
                originalPrice: 5999,
                rating: 4.6,
                reviews: 112,
                category: "Home",
                image: "img-desk-lamp.PNG",
                description: "Modern desk lamp with built-in wireless charger and adjustable brightness. Perfect for home office.",
                features: ["Wireless Charger", "Adjustable Brightness", "Modern Design", "USB Port"]
            }
        ];

        // Cart functionality
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        const cartCount = document.getElementById('cart-count');
        
        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            renderProducts();
            updateCartCount();
            setupScrollAnimations();
            
            // Close modal when clicking outside
            document.getElementById('product-modal').addEventListener('click', function(e) {
                if (e.target === this) {
                    closeProductModal();
                }
            });
        });

        // Render products in different sections
        function renderProducts() {
            const featuredSection = document.querySelector('.bg-gray-50 .grid');
            const trendingSection = document.querySelector('.bg-white .grid');
            const recommendedSection = document.querySelector('.bg-gray-50:last-child .grid');
            
            // Clear existing content
            featuredSection.innerHTML = '';
            trendingSection.innerHTML = '';
            recommendedSection.innerHTML = '';
            
            // Distribute products to sections
            products.forEach((product, index) => {
                const productCard = createProductCard(product);
                
                if (index < 4) {
                    featuredSection.appendChild(productCard);
                } else if (index < 8) {
                    trendingSection.appendChild(productCard);
                } else {
                    recommendedSection.appendChild(productCard);
                }
            });
        }

        // Create product card HTML
        function createProductCard(product) {
            const card = document.createElement('div');
            card.className = 'product-card bg-white rounded-lg shadow-md overflow-hidden cursor-pointer category-cardd';
            card.setAttribute('data-id', product.id);
            
            const discount = Math.round(((product.originalPrice - product.price) / product.originalPrice) * 100);
            
            card.innerHTML = `
                <div class="relative">
                    <img src="${product.image}" alt="${product.name}" class="w-full h-48 object-cover">
                    <span class="absolute top-2 right-2 bg-red-500 text-white text-xs font-bold px-2 py-1 rounded">${discount}% OFF</span>
                </div>
                <div class="p-4">
                    <h3 class="font-semibold text-lg mb-1 truncate">${product.name}</h3>
                    <div class="flex items-center mb-2">
                        <div class="flex text-yellow-400 mr-2">
                            ${generateStarRating(product.rating)}
                        </div>
                        <span class="text-gray-600 text-sm">(${product.reviews})</span>
                    </div>
                    <div class="flex items-center justify-between">
                        <div>
                            <span class="text-lg font-bold text-gray-900">₹${product.price.toFixed(2)}</span>
                            <span class="text-sm text-gray-500 line-through ml-2">₹${product.originalPrice.toFixed(2)}</span>
                        </div>
                        <button class="add-to-cart bg-indigo-600 text-white p-2 rounded-full hover:bg-indigo-700 transition-colors" data-id="${product.id}">
                            <i class="fas fa-shopping-cart"></i>
                        </button>
                    </div>
                </div>
            `;
            
            // Add event listeners
            card.addEventListener('click', (e) => {
                if (!e.target.closest('.add-to-cart')) {
                    openProductModal(product.id);
                }
            });
            
            card.querySelector('.add-to-cart').addEventListener('click', (e) => {
                e.stopPropagation();
                addToCart(product.id);
            });
            
            return card;
        }

        // Generate star rating HTML
        function generateStarRating(rating) {
            let stars = '';
            const fullStars = Math.floor(rating);
            const hasHalfStar = rating % 1 !== 0;
            
            for (let i = 0; i < fullStars; i++) {
                stars += '<i class="fas fa-star"></i>';
            }
            
            if (hasHalfStar) {
                stars += '<i class="fas fa-star-half-alt"></i>';
            }
            
            const emptyStars = 5 - Math.ceil(rating);
            for (let i = 0; i < emptyStars; i++) {
                stars += '<i class="far fa-star"></i>';
            }
            
            return stars;
        }

        // Open product modal
        function openProductModal(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;
            
            const modal = document.getElementById('product-modal');
            const modalContent = modal.querySelector('.modal-content');
            
            const discount = Math.round(((product.originalPrice - product.price) / product.originalPrice) * 100);
            
            modalContent.innerHTML = `
                <div class="p-6">
                    <button id="close-modal" class="absolute top-4 right-4 text-gray-500 hover:text-gray-700">
                        <i class="fas fa-times text-2xl"></i>
                    </button>
                    
                    <div class="flex flex-col md:flex-row gap-8">
                        <div class="md:w-1/2">
                            <img src="${product.image}" alt="${product.name}" class="w-full rounded-lg">
                        </div>
                        <div class="md:w-1/2">
                            <h2 class="text-2xl font-bold mb-2">${product.name}</h2>
                            <div class="flex items-center mb-4">
                                <div class="flex text-yellow-400 mr-2">
                                    ${generateStarRating(product.rating)}
                                </div>
                                <span class="text-gray-600">${product.rating} (${product.reviews} reviews)</span>
                            </div>
                            
                            <div class="mb-4">
                                <span class="text-3xl font-bold text-gray-900">$${product.price.toFixed(2)}</span>
                                <span class="text-lg text-gray-500 line-through ml-2">$${product.originalPrice.toFixed(2)}</span>
                                <span class="ml-2 bg-red-500 text-white text-sm font-bold px-2 py-1 rounded">${discount}% OFF</span>
                            </div>
                            
                            <p class="text-gray-700 mb-6">${product.description}</p>
                            
                            <div class="mb-6">
                                <h3 class="font-semibold mb-2">Key Features:</h3>
                                <ul class="list-disc list-inside text-gray-700">
                                    ${product.features.map(feature => `<li>${feature}</li>`).join('')}
                                </ul>
                            </div>
                            
                            <div class="flex items-center mb-6">
                                <span class="mr-4 font-medium">Quantity:</span>
                                <div class="flex items-center border border-gray-300 rounded">
                                    <button class="decrease-quantity px-3 py-1 text-gray-600 hover:bg-gray-100">-</button>
                                    <span class="quantity px-4 py-1">1</span>
                                    <button class="increase-quantity px-3 py-1 text-gray-600 hover:bg-gray-100">+</button>
                                </div>
                            </div>
                            
                            <div class="flex space-x-4">
                                <button class="add-to-cart-modal flex-1 bg-indigo-600 text-white py-3 px-6 rounded-lg font-semibold hover:bg-indigo-700 transition-colors" data-id="${product.id}">
                                    <i class="fas fa-shopping-cart mr-2"></i> Add to Cart
                                </button>
                                <button class="buy-now flex-1 bg-green-600 text-white py-3 px-6 rounded-lg font-semibold hover:bg-green-700 transition-colors">
                                    Buy Now
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            // Add event listeners for modal
            document.getElementById('close-modal').addEventListener('click', closeProductModal);
            
            const decreaseBtn = modalContent.querySelector('.decrease-quantity');
            const increaseBtn = modalContent.querySelector('.increase-quantity');
            const quantitySpan = modalContent.querySelector('.quantity');
            
            decreaseBtn.addEventListener('click', () => {
                let quantity = parseInt(quantitySpan.textContent);
                if (quantity > 1) {
                    quantitySpan.textContent = quantity - 1;
                }
            });
            
            increaseBtn.addEventListener('click', () => {
                let quantity = parseInt(quantitySpan.textContent);
                quantitySpan.textContent = quantity + 1;
            });
            
            modalContent.querySelector('.add-to-cart-modal').addEventListener('click', () => {
                const quantity = parseInt(quantitySpan.textContent);
                addToCart(product.id, quantity);
                closeProductModal();
            });
            
            // Show modal
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.add('modal-open');
            }, 10);
        }

        // Close product modal
        function closeProductModal() {
            const modal = document.getElementById('product-modal');
            modal.classList.remove('modal-open');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        // Add product to cart
        function addToCart(productId, quantity = 1) {
            const product = products.find(p => p.id === productId);
            if (!product) return;
            
            const existingItem = cart.find(item => item.id === productId);
            
            if (existingItem) {
                existingItem.quantity += quantity;
            } else {
                cart.push({
                    id: product.id,
                    name: product.name,
                    price: product.price,
                    image: product.image,
                    quantity: quantity
                });
            }
            
            // Save to localStorage
            localStorage.setItem('cart', JSON.stringify(cart));
            
            // Update UI
            updateCartCount();
            showNotification();
        }

        // Update cart count in navbar
        function updateCartCount() {
            const totalItems = cart.reduce((total, item) => total + item.quantity, 0);
            cartCount.textContent = totalItems;
            
            // Add animation
            cartCount.classList.add('pulse');
            setTimeout(() => {
                cartCount.classList.remove('pulse');
            }, 500);
        }

        // Show notification
        function showNotification() {
            const notification = document.getElementById('notification');
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // Setup scroll animations
        function setupScrollAnimations() {
            const fadeElements = document.querySelectorAll('.fade-in');
            
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, { threshold: 0.1 });
            
            fadeElements.forEach(el => {
                observer.observe(el);
            });
        }
    </script>
    
<script src="script.js"></script>
</body>
